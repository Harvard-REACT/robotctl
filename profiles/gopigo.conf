# robotctl build profile -- GoPiGo images (meta-gopigo, Raspberry Pi 5).

# --- identity ------------------------------------------------------------
ROBOTCTL_DEFAULT_ROBOT_ID=gopigo-unprovisioned
#ROBOTCTL_DEFAULT_ROS_DOMAIN_ID=0

# --- paths ---------------------------------------------------------------
# robot.conf and wifi/, on /data so they survive an A/B update.
#ROBOTCTL_CONFIG_DIR=/data/robot
#ROBOTCTL_DATA_DIR=/data
# Generated hostapd/dnsmasq configs. tmpfs: rebuilt on every AP start.
#ROBOTCTL_RUN_DIR=/run/robot-wifi
# Derived outputs, written but never read back.
#ROBOTCTL_HOSTNAME_PATH=/etc/hostname
#ROBOTCTL_HOSTS_PATH=/etc/hosts
# Written into the rootfs by gopigo-image.bb.
#ROBOTCTL_IMAGE_VERSION_PATH=/etc/robot/image-version
# meta-gopigo's robot-update recipe, RAUC's bootloader backend for tryboot.
#ROBOTCTL_TRYBOOT_BACKEND=/usr/libexec/rauc/tryboot-backend

# --- wifi ----------------------------------------------------------------
#ROBOTCTL_WIFI_INTERFACE=wlan-ctrl
#ROBOTCTL_WIFI_UNIT=robotctl-wifi.service

# --- mDNS ----------------------------------------------------------------
# Empty disables the post-rename nudge entirely.
#ROBOTCTL_MDNS_UNIT=avahi-daemon.service

# --- wifi supervisor tuning ----------------------------------------------
#ROBOTCTL_WIFI_CONNECT_TIMEOUT_SEC=45
#ROBOTCTL_WIFI_CLIENT_ATTEMPTS=3
#ROBOTCTL_WIFI_RETRY_SEC=5
#ROBOTCTL_WIFI_LINK_POLL_SEC=10
#ROBOTCTL_WIFI_AP_RETRY_SEC=300
