# robotctl build profile -- LoCoBot images.
#
# Compiled in by build.rs when the binary is built with ROBOTCTL_PROFILE=locobot.
# See profiles/gopigo.conf for the shape of one of these; only keys that differ
# from the built-in defaults need to be here.
#
# UNFLASHED: the image this describes does not exist yet, so everything below
# except the identity default is still the GoPiGo answer inherited from the
# built-ins. Each key that plausibly differs on LoCoBot hardware is listed
# commented out with the value it currently gets -- uncomment and correct it as
# the image takes shape, rather than discovering the mismatch on the robot.

# --- identity ------------------------------------------------------------
# The hostname an unprovisioned LoCoBot announces itself under.
ROBOTCTL_DEFAULT_ROBOT_ID=locobot-unprovisioned
#ROBOTCTL_DEFAULT_ROS_DOMAIN_ID=0

# --- wifi ----------------------------------------------------------------
# TODO(locobot): the default names a *role*, and something in the image has to
# map it to hardware -- meta-gopigo does it with a systemd .link file in
# robot-udev. Either ship the equivalent for the LoCoBot's NIC or set the
# interface name here; leaving both undone means robotctl drives nothing.
#ROBOTCTL_WIFI_INTERFACE=wlan-ctrl
#ROBOTCTL_WIFI_UNIT=robotctl-wifi.service
# Empty, as the built-in default has it: nothing runs on a state change. Point
# this at a command if the LoCoBot grows a WiFi indicator -- the GoPiGo images
# use it to drive their board's WiFi LED. See docs/API.md for the contract.
#ROBOTCTL_WIFI_STATE_HOOK=

# --- paths ---------------------------------------------------------------
#ROBOTCTL_CONFIG_DIR=/data/robot
#ROBOTCTL_DATA_DIR=/data
#ROBOTCTL_RUN_DIR=/run/robot-wifi
#ROBOTCTL_HOSTNAME_PATH=/etc/hostname
#ROBOTCTL_HOSTS_PATH=/etc/hosts
# Whatever writes the image version into the LoCoBot rootfs has to agree with
# this path; `robotctl status` reports "unknown" if nothing does.
#ROBOTCTL_IMAGE_VERSION_PATH=/etc/robot/image-version
# TODO(locobot): tryboot is Raspberry Pi bootloader machinery. If the LoCoBot
# image uses a different RAUC bootloader backend, point this at it; `status`
# only ever calls its read-only verbs, so a wrong path degrades the slot report
# rather than breaking updates.
#ROBOTCTL_TRYBOOT_BACKEND=/usr/libexec/rauc/tryboot-backend

# --- mDNS ----------------------------------------------------------------
#ROBOTCTL_MDNS_UNIT=avahi-daemon.service

# --- wifi supervisor tuning ----------------------------------------------
#ROBOTCTL_WIFI_CONNECT_TIMEOUT_SEC=45
#ROBOTCTL_WIFI_CLIENT_ATTEMPTS=3
#ROBOTCTL_WIFI_RETRY_SEC=5
#ROBOTCTL_WIFI_LINK_POLL_SEC=10
#ROBOTCTL_WIFI_AP_RETRY_SEC=300
