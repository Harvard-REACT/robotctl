[package]
name = "robotctl"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
anyhow = "1"
thiserror = "2"
# Only for kill(2) with SIGTERM. std's Child::kill sends SIGKILL, which would stop hostapd
# without letting it deauthenticate its clients and wpa_supplicant without a clean disassociate.
# One crate, no transitive dependencies, so it costs almost nothing to vendor for Yocto.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
